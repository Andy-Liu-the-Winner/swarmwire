name: Linux release wheel
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Build installable wheel
        run: |
          python -m pip install build wheel
          python -m build
      - name: Verify native wheel without compiler access
        shell: bash
        run: |
          python -m venv /tmp/swarmwire-install
          /tmp/swarmwire-install/bin/python -m pip install dist/*.whl
          cd /tmp
          CXX=/missing-compiler /tmp/swarmwire-install/bin/python -m swarmwire check --backend local
      - name: Attach verified wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber
