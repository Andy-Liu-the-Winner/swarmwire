[build-system]
requires = ["setuptools>=61", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmwire"
version = "0.4.0"
description = "C++ local message router with Python, OpenAI, Anthropic and MCP adapters"
authors = [{name = "Andy Liu"}]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["async-timeout>=5; python_version < '3.11'"]

[project.optional-dependencies]
fast = ["orjson>=3.10", "uvloop>=0.21; sys_platform != 'win32'"]
mcp = ["mcp>=1.12,<2"]
zeromq = ["pyzmq>=26"]
nats = ["nats-py>=2.9"]
langgraph = ["langgraph>=1.0"]
bench = ["pyzmq>=26", "nats-py>=2.9", "orjson>=3.10", "uvloop>=0.21; sys_platform != 'win32'"]

[project.scripts]
swarmwire = "swarmwire.__main__:main"

[tool.setuptools.packages.find]
include = ["swarmwire*"]
